[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naloxone-selective-review"
version = "0.1.0"
description = "Privacy-safe selective ML review support for naloxone-at-discharge prioritization"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.5",
  "joblib>=1.3"
]

[project.scripts]
p2-review = "clinical_review.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
